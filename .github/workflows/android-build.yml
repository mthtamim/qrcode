name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.x

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Install Capacitor CLI & Core
        run: npm install @capacitor/core @capacitor/android @capacitor/cli @capacitor/assets

      - name: Initialize Capacitor
        run: npx cap init Pressmark com.pressmark.app --web-dir .vercel/output/static

      - name: Add Android Platform
        run: npx cap add android

      - name: Generate Icons and Splash Screens
        run: npx @capacitor/assets generate --android --assetPath assets

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: pressmark-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
