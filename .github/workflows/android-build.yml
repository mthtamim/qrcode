git checkout main
git pull origin main
mkdir -p .github/workflows
cat > .github/workflows/android-build.yml <<'EOF'
name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck
        continue-on-error: true

      - name: Build web application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist
          retention-days: 7

  build-android:
    runs-on: ubuntu-latest
    needs: build-web
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0

      - name: Install npm dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Add Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -x lint --no-daemon --parallel

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pressmark-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Android Release Bundle
        working-directory: android
        run: ./gradlew bundleRelease -x lint --no-daemon --parallel
        continue-on-error: true

      - name: Upload Release Bundle
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pressmark-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Create Build Summary
        if: always()
        run: |
          echo "# Android Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build Status: $([ -f 'android/app/build/outputs/apk/debug/app-debug.apk' ] && echo 'Success' || echo 'Failed')" >> $GITHUB_STEP_SUMMARY
          echo "📦 Debug APK: android/app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "📍 Download from Artifacts section" >> $GITHUB_STEP_SUMMARY
EOF

git add .github/workflows/android-build.yml
git commit -m "fix: update Android workflow to upload-artifact v4"
git push origin main
